name: iOS build

on:
  push:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Также собрать подписанный Ad Hoc IPA (нужны Apple secrets и variables)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project UrFUSchedule.xcodeproj -scheme UrFUSchedule -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UrFUSchedule.app Payload/
          echo "Watch app:"; ls Payload/UrFUSchedule.app/Watch
          zip -qry UrFUSchedule-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: UrFUSchedule-unsigned-ipa
          path: UrFUSchedule-unsigned.ipa
          if-no-files-found: error

  signed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
    runs-on: macos-15
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID }}
      CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APP_PROFILE_BASE64: ${{ secrets.APPLE_APP_PROFILE_BASE64 }}
      WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Configure signing and generate project
        run: |
          set -euo pipefail
          for key in APPLE_TEAM_ID APP_BUNDLE_ID APP_GROUP_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APP_PROFILE_BASE64 WIDGET_PROFILE_BASE64; do
            if [ -z "${!key:-}" ]; then echo "Missing repository variable or secret: $key" >&2; exit 1; fi
          done
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" > "$RUNNER_TEMP/widget.plist"
          export APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app.plist")
          export WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_PROFILE_UUID.mobileprovision"
          cp "$RUNNER_TEMP/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision"
          python3 scripts/configure-signing.py
          xcodegen generate
      - name: Archive and export signed IPA
        run: |
          set -o pipefail
          xcodebuild -project UrFUSchedule.xcodeproj -scheme UrFUSchedule -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/UrFUSchedule.xcarchive" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UrFUSchedule.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: UrFUSchedule-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
