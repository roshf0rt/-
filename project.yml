name: UrFUSchedule
options:
  bundleIdPrefix: ru.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  UrFUSchedule:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/UrFUSchedule.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.example.urfu.schedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.example.UrFUSchedule
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Расписание УрФУ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: ScheduleWidget
        embed: true
  ScheduleWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/ScheduleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.example.urfu.schedule
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Расписание УрФУ
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.example.UrFUSchedule.ScheduleWidget
        SKIP_INSTALL: YES
