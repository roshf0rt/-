name: UrFUSchedule
options:
  bundleIdPrefix: ru.roshfort
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  UrFUSchedule:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/UrFUSchedule.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.roshfort.urfu.schedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.roshfort.UrFUSchedule
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Расписание УрФУ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Виджет показывает, сколько ехать до корпуса пары, и краснеет заранее, если вы далеко."
    dependencies:
      - target: ScheduleWidget
        embed: true
  ScheduleWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/ScheduleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.roshfort.urfu.schedule
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Расписание УрФУ
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.roshfort.UrFUSchedule.ScheduleWidget
        SKIP_INSTALL: YES
