name: UrfuSchedule
options:
  bundleIdPrefix: ru.urfu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  UrfuSchedule:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/UrfuSchedule.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.urfu.schedule
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Расписание УрФУ
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.urfu.schedule
    dependencies:
      - target: UrfuScheduleWidget

  UrfuScheduleWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/UrfuScheduleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.urfu.schedule
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Расписание
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.urfu.schedule.widget
