name: UrFUSchedule
options:
  bundleIdPrefix: ru.roshfort
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  UrFUSchedule:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/UrFUSchedule.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.roshfort.urfu.schedule
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Расписание УрФУ
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ru.roshfort.urfu.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.roshfort.UrFUSchedule
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Расписание УрФУ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Виджет показывает, сколько ехать до корпуса пары, и краснеет заранее, если вы далеко."
    dependencies:
      - target: ScheduleWidget
        embed: true
      - target: UrFUWatch
        embed: true
  ScheduleWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/ScheduleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ru.roshfort.urfu.schedule
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Расписание УрФУ
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.roshfort.UrFUSchedule.ScheduleWidget
        SKIP_INSTALL: YES
  UrFUWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared/Models.swift
      - Shared/ScheduleAPI.swift
      - Shared/LessonStyle.swift
      - Shared/Theme.swift
      - Shared/WatchPayload.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: УрФУ
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: ru.roshfort.UrFUSchedule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.roshfort.UrFUSchedule.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
