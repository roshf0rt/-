# Общее ДЗ: API и Caddy с бесплатным HTTPS-сертификатом для $DOMAIN.
services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
