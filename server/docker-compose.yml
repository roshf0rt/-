# Общее ДЗ. API слушает только 127.0.0.1:8100. Если на сервере уже есть Caddy,
# install.sh добавляет в него адрес для ДЗ; иначе запускает свой Caddy (профиль own-proxy).
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2.8.4
    profiles: [own-proxy]
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
